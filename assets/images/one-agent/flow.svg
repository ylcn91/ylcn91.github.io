<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>From a Teams message to a merge</title>
  <rect width="360" height="640" fill="#F3E9D2"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3A3A38"/>
    </marker>
  </defs>
  <g font-size="16" fill="#2B2B29">
    <!-- step boxes: x=30 w=300 h=56, gap 20 -->
    <rect x="30" y="20" width="300" height="56" rx="10" fill="#FFFDF7" stroke="#3A3A38" stroke-width="1.5"/>
    <text x="48" y="44" font-weight="600">A message in a Teams group</text>
    <text x="48" y="64" font-size="14" fill="#5C5A55">anyone, in their own words</text>

    <rect x="30" y="96" width="300" height="56" rx="10" fill="#FFFDF7" stroke="#3A3A38" stroke-width="1.5"/>
    <text x="48" y="120" font-weight="600">A plan, posted back</text>
    <text x="48" y="140" font-size="14" fill="#5C5A55">the coordinator agent writes it</text>

    <rect x="30" y="172" width="300" height="56" rx="10" fill="#DCE6D3" stroke="#4E6B45" stroke-width="1.5"/>
    <text x="48" y="196" font-weight="600">A person approves</text>
    <text x="48" y="216" font-size="14" fill="#3F5638">nothing is built before this</text>

    <rect x="30" y="248" width="300" height="56" rx="10" fill="#FFFDF7" stroke="#3A3A38" stroke-width="1.5"/>
    <text x="48" y="272" font-weight="600">A worker writes the code</text>
    <text x="48" y="292" font-size="14" fill="#5C5A55">local checks, push, branch build</text>

    <rect x="30" y="324" width="300" height="56" rx="10" fill="#FFFDF7" stroke="#3A3A38" stroke-width="1.5"/>
    <text x="48" y="348" font-weight="600">Two reviews and a preview test</text>
    <text x="48" y="368" font-size="14" fill="#5C5A55">two different reviewers, same commit</text>

    <rect x="30" y="400" width="300" height="56" rx="10" fill="#F4DCD0" stroke="#A65A3F" stroke-width="1.5"/>
    <text x="48" y="424" font-weight="600">The server's gate</text>
    <text x="48" y="444" font-size="14" fill="#7E4430">all green on one head, or no PR</text>

    <rect x="30" y="476" width="300" height="56" rx="10" fill="#FFFDF7" stroke="#3A3A38" stroke-width="1.5"/>
    <text x="48" y="500" font-weight="600">Pull request, then QA</text>
    <text x="48" y="520" font-size="14" fill="#5C5A55">the Jira task moves by itself</text>

    <rect x="30" y="552" width="300" height="56" rx="10" fill="#DCE6D3" stroke="#4E6B45" stroke-width="1.5"/>
    <text x="48" y="576" font-weight="600">A person merges</text>
    <text x="48" y="596" font-size="14" fill="#3F5638">always</text>
  </g>
  <g stroke="#3A3A38" stroke-width="1.5" marker-end="url(#a)">
    <line x1="180" y1="76" x2="180" y2="94"/>
    <line x1="180" y1="152" x2="180" y2="170"/>
    <line x1="180" y1="228" x2="180" y2="246"/>
    <line x1="180" y1="304" x2="180" y2="322"/>
    <line x1="180" y1="380" x2="180" y2="398"/>
    <line x1="180" y1="456" x2="180" y2="474"/>
    <line x1="180" y1="532" x2="180" y2="550"/>
  </g>
</svg>
