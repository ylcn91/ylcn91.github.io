<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>What the agent may do is the overlap of the person and the room</title>
  <rect width="360" height="470" fill="#F3E9D2"/>
  <circle cx="135" cy="150" r="105" fill="#C9D8BF" fill-opacity="0.75" stroke="#4E6B45" stroke-width="1.5"/>
  <circle cx="225" cy="150" r="105" fill="#E9BBA6" fill-opacity="0.65" stroke="#A65A3F" stroke-width="1.5"/>
  <g font-size="16" fill="#2B2B29" text-anchor="middle">
    <text x="88" y="140" font-weight="600">The person</text>
    <text x="88" y="162" font-size="14" fill="#3F5638">what they</text>
    <text x="88" y="180" font-size="14" fill="#3F5638">may see</text>
    <text x="272" y="140" font-weight="600">The room</text>
    <text x="272" y="162" font-size="14" fill="#7E4430">what this chat</text>
    <text x="272" y="180" font-size="14" fill="#7E4430">may hold</text>
    <text x="180" y="146" font-weight="700">Agent</text>
    <text x="180" y="166" font-weight="700">acts</text>
    <text x="180" y="186" font-weight="700">here</text>
  </g>
  <g font-size="15" fill="#2B2B29">
    <text x="30" y="300" font-weight="600">Checked in code, under the model</text>
    <text x="30" y="326" fill="#5C5A55">Unlisted person: nothing.</text>
    <text x="30" y="350" fill="#5C5A55">Grant missing in either layer: denied.</text>
    <text x="30" y="374" fill="#5C5A55">Same question, different room,</text>
    <text x="30" y="396" fill="#5C5A55">different answer.</text>
    <text x="30" y="430" fill="#5C5A55">The prompt cannot widen it.</text>
  </g>
</svg>
