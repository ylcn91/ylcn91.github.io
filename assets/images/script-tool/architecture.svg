<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Script tool architecture</title>
<style></style>
<rect width="800" height="520" fill="#F3E9D2"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A65A3F"/></marker></defs>
<text x="24" y="34" font-size="17" fill="#2B2B29" text-anchor="start" font-weight="600">Where a Script runs</text>
<text x="24" y="56" font-size="13" fill="#5C5A55" text-anchor="start" font-weight="normal">Everything inside the dashed frame runs on the machine that runs the agent.</text>
<rect x="200" y="74" width="440" height="430" rx="10" fill="none" stroke="#5C5A55" stroke-dasharray="5 4"/><text x="214" y="494" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">Daemon on the agent's machine</text>
<rect x="24" y="90" width="150" height="100" rx="6" fill="#FBF6EA" stroke="#2B2B29" stroke-width="1.3"/>
<text x="36" y="112" font-size="14" fill="#2B2B29" text-anchor="start" font-weight="600">Alp server</text>
<text x="36" y="132" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">issues and task queue</text>
<text x="36" y="150" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">tool gate, deny rules</text>
<text x="36" y="168" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">usage per run</text>
<rect x="24" y="300" width="150" height="64" rx="6" fill="#FBF6EA" stroke="#2B2B29" stroke-width="1.3"/>
<text x="36" y="322" font-size="14" fill="#2B2B29" text-anchor="start" font-weight="600">Model API</text>
<text x="36" y="342" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">Opus 5.5</text>
<rect x="220" y="90" width="190" height="66" rx="6" fill="#FBF6EA" stroke="#2B2B29" stroke-width="1.3"/>
<text x="232" y="112" font-size="14" fill="#2B2B29" text-anchor="start" font-weight="600">Claude Code</text>
<text x="232" y="132" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">the model's direct tools</text>
<text x="232" y="150" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">off in only mode</text>
<rect x="430" y="90" width="190" height="66" rx="6" fill="#FBF6EA" stroke="#2B2B29" stroke-width="1.3"/>
<text x="442" y="112" font-size="14" fill="#2B2B29" text-anchor="start" font-weight="600">alp-script endpoint</text>
<text x="442" y="132" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">MCP on loopback</text>
<text x="442" y="150" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">inside the daemon</text>
<rect x="430" y="214" width="190" height="84" rx="6" fill="#FBF6EA" stroke="#2B2B29" stroke-width="1.3"/>
<text x="442" y="236" font-size="14" fill="#2B2B29" text-anchor="start" font-weight="600">Deno sandbox</text>
<text x="442" y="256" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">the model's JavaScript</text>
<text x="442" y="274" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">no permissions</text>
<text x="442" y="292" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">128 MB heap, CPU limit</text>
<rect x="220" y="214" width="190" height="84" rx="6" fill="#FBF6EA" stroke="#2B2B29" stroke-width="1.3"/>
<text x="232" y="236" font-size="14" fill="#2B2B29" text-anchor="start" font-weight="600">Dispatcher (Go)</text>
<text x="232" y="256" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">deny rules, tool gate</text>
<text x="232" y="274" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">approval, path inside run</text>
<text x="232" y="292" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">same checks as direct calls</text>
<rect x="220" y="340" width="400" height="138" rx="6" fill="#FBF6EA" stroke="#2B2B29" stroke-width="1.3"/>
<text x="232" y="362" font-size="14" fill="#2B2B29" text-anchor="start" font-weight="600">Nested tools</text>
<text x="232" y="382" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">Read, Edit, Write: Go, confined to the run folder</text>
<text x="232" y="400" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">Grep: rg --json, Glob: fd</text>
<text x="232" y="418" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">AstGrep, Outline: ast-grep</text>
<text x="232" y="436" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">Execute: shell command in the run's sandbox</text>
<text x="232" y="454" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">MCP: tools.server.tool(), over HTTP or stdio</text>
<rect x="660" y="350" width="120" height="120" rx="6" fill="#FBF6EA" stroke="#2B2B29" stroke-width="1.3"/>
<text x="672" y="372" font-size="14" fill="#2B2B29" text-anchor="start" font-weight="600">MCP servers</text>
<text x="672" y="392" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">remote</text>
<text x="672" y="410" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">stdio</text>
<text x="672" y="428" font-size="12" fill="#5C5A55" text-anchor="start" font-weight="normal">machine-local</text>
<line x1="174" y1="120" x2="218" y2="120" stroke="#A65A3F" stroke-width="1.8" marker-end="url(#ah)"/>
<circle cx="196" cy="104" r="9" fill="#A65A3F"/><text x="196" y="108" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
<text x="210" y="108" font-size="11.5" fill="#2B2B29" text-anchor="start" font-weight="normal"></text>
<line x1="410" y1="112" x2="428" y2="112" stroke="#A65A3F" stroke-width="1.8" marker-end="url(#ah)"/>
<circle cx="419" cy="80" r="9" fill="#A65A3F"/><text x="419" y="84" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
<text x="433" y="84" font-size="11.5" fill="#2B2B29" text-anchor="start" font-weight="normal"></text>
<line x1="525" y1="156" x2="525" y2="212" stroke="#A65A3F" stroke-width="1.8" marker-end="url(#ah)"/>
<circle cx="540" cy="184" r="9" fill="#A65A3F"/><text x="540" y="188" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
<text x="554" y="188" font-size="11.5" fill="#2B2B29" text-anchor="start" font-weight="normal">program</text>
<line x1="430" y1="256" x2="412" y2="256" stroke="#A65A3F" stroke-width="1.8" marker-end="url(#ah)"/>
<circle cx="421" cy="236" r="9" fill="#A65A3F"/><text x="421" y="240" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
<text x="435" y="240" font-size="11.5" fill="#2B2B29" text-anchor="start" font-weight="normal"></text>
<line x1="315" y1="298" x2="315" y2="338" stroke="#A65A3F" stroke-width="1.8" marker-end="url(#ah)"/>
<circle cx="330" cy="324" r="9" fill="#A65A3F"/><text x="330" y="328" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">5</text>
<text x="344" y="328" font-size="11.5" fill="#2B2B29" text-anchor="start" font-weight="normal">checked call</text>
<line x1="620" y1="410" x2="658" y2="410" stroke="#A65A3F" stroke-width="1.8" marker-end="url(#ah)"/>
<circle cx="639" cy="394" r="9" fill="#A65A3F"/><text x="639" y="398" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">6</text>
<text x="653" y="398" font-size="11.5" fill="#2B2B29" text-anchor="start" font-weight="normal"></text>
<line x1="430" y1="140" x2="412" y2="140" stroke="#4E6B45" stroke-width="1.8" marker-end="url(#ah)"/><line x1="220" y1="140" x2="176" y2="320" stroke="#5C5A55" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="421" cy="168" r="9" fill="#4E6B45"/><text x="421" y="172" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="700">7</text>
<text x="24" y="400" font-size="12" fill="#4E6B45" text-anchor="start" font-weight="600">7  Only printed text</text>
<text x="24" y="416" font-size="12" fill="#4E6B45" text-anchor="start" font-weight="normal">returns to the model,</text>
<text x="24" y="432" font-size="12" fill="#4E6B45" text-anchor="start" font-weight="normal">at most 64 KiB.</text>
</svg>
