<line x1="24" y1="305.0" x2="760" y2="305.0" stroke="#B8B0A0"/>
<text x="24" y="392" font-size="11.5" fill="#5C5A55" text-anchor="start" font-weight="normal">Green: the interval excludes zero. Grey: no measurable difference.</text>
