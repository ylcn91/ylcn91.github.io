<text x="663.125" y="244" font-size="12" fill="#2B2B29" text-anchor="start" font-weight="600">-20%</text>
<line x1="623.5" y1="280" x2="724.1" y2="280" stroke="#B8B0A0" stroke-width="3" stroke-linecap="round"/>
