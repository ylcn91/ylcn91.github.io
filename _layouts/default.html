<!DOCTYPE html>
<html lang="{{ page.lang | default: "en" }}">
  {%- include head.html -%}
  <body a="{{ site.theme_config.appearance | default: "auto" }}">
    <main class="page-content" aria-label="Content">
      <div class="w">
        {{ content }}
      </div>
    </main>

    {%-if site.goat_counter and jekyll.environment == "production"-%}
      {%-include goat_counter.html-%}
    {%-endif-%}

    {% if page.custom_js %}
      {% for js_file in page.custom_js %}
        <script type="text/javascript" src="{{ site.baseurl }}/assets/js/{{ js_file }}.js"></script>
      {% endfor %}
    {% endif %}

    <script>
      (function() {
        function openExternalLinksInNewTab() {
          var links = document.querySelectorAll("a[href^='http://'], a[href^='https://']");
          var currentHost = window.location.hostname;
          for (var i = 0; i < links.length; i++) {
            var link = links[i];
            if (link.hostname && link.hostname !== currentHost) {
              link.setAttribute("target", "_blank");
              link.setAttribute("rel", "noopener noreferrer");
            }
          }
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", openExternalLinksInNewTab);
        } else {
          openExternalLinksInNewTab();
        }
      })();
    </script>
  </body>
</html>
